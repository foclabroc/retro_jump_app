name: retro_jump
description: Rétro Jump — jeu de saut vertical rétro (classement en ligne, partie du jour)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  crypto: ^3.0.3
  permission_handler: ^11.3.0
  sensors_plus: ^7.1.0
  wakelock_plus: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/game/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D0F14"
  adaptive_icon_foreground: "assets/icon_fg.png"
